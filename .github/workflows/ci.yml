name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same checks `omarchy plugin validate` runs; release.yml runs the
      # same script before it tags and again before it publishes.
      - name: Validate manifest.json
        run: ./scripts/check-manifest.sh
      # Bumps a disposable copy to a throwaway version and back, proving the
      # release version rewrite is surgical and round-trips byte-for-byte.
      - name: Set-version round trip
        run: ./tests/test-set-version.sh
      - name: Data files parse
        run: |
          jq -e 'type == "array" and length > 0' cities.json >/dev/null
          jq -e 'type == "array" and length > 0' world.json >/dev/null
      - name: Python compiles
        run: python3 -m py_compile worldclock-data.py tests/currency_check.py

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Qt test runner and iso-codes
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            iso-codes \
            qt6-declarative-dev-tools \
            qml6-module-qtqml-workerscript \
            qml6-module-qtquick \
            qml6-module-qtquick-window \
            qml6-module-qttest
      # --offline keeps the run deterministic: the live-rate and Open-Meteo
      # cross-checks are worth running by hand but should not fail a PR when
      # a third-party feed hiccups.
      - name: Run tests
        run: ./tests/run --offline
